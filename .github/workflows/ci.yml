name: Validate & Build Index

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schemas and manifests
        run: npm run validate

  build-index:
    name: Build & Verify Index
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate index
        run: npm run build:index

      - name: Verify index is up-to-date
        run: |
          if [ -n "$(git diff --name-only index.json 2>/dev/null)" ]; then
            echo "::error::index.json is out of date. Run 'npm run build:index' and commit the result."
            git diff index.json
            exit 1
          fi
          echo "index.json is up-to-date and deterministic."

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for symlinks
        run: |
          echo "Checking for problematic symlinks..."
          SYMLINKS=$(find . -type l 2>/dev/null | grep -v node_modules || true)
          if [ -n "$SYMLINKS" ]; then
            echo "::warning::Found symlinks in repository:"
            echo "$SYMLINKS"
          else
            echo "No symlinks found."
          fi

      - name: Check for path traversal
        run: |
          echo "Checking for path traversal patterns..."
          if grep -r '\.\./' agents/ teams/ workflows/ 2>/dev/null; then
            echo "::error::Path traversal patterns found in manifests."
            exit 1
          fi
          echo "No path traversal patterns found."

      - name: Check file sizes
        run: |
          echo "Checking file sizes..."
          LARGE_FILES=$(find agents/ teams/ workflows/ -type f -size +10M 2>/dev/null || true)
          if [ -n "$LARGE_FILES" ]; then
            echo "::error::Files larger than 10MB found:"
            echo "$LARGE_FILES"
            exit 1
          fi
          echo "All files within size limits."
